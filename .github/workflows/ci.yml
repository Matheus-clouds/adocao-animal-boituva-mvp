name: CI

on:
  push:
    branches: [main, docs/rastreabilidade-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests and report coverage
        run: node --experimental-test-coverage --test tests/validation.test.js tests/flow.integration.test.js
